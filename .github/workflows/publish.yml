name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to PyPI (true/false)'
        required: false
        default: 'false'

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.os == 'macos-latest' && '12.0' || '' }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]  # macos-latest is ARM64 (Apple Silicon)
        python-version: ['3.12', '3.13', '3.14', '3.15']
      fail-fast: false
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Load versions
      run: cat versions.cfg >> "$GITHUB_ENV"
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache Redis submodule
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: redis.submodule
        key: redis-${{ env.REDIS_VERSION }}-${{ matrix.os }}-${{ runner.arch }}${{ matrix.os == 'macos-latest' && '-target12' || '' }}
    
    - name: Cache FalkorDB module
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          falkordb.so
          falkordb.version
        key: falkordb-${{ env.FALKORDB_VERSION }}-${{ runner.os }}-${{ runner.arch }}
    
    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make python3-dev
    
    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gcc make libomp
        # Use the Command Line Tools toolchain so ld matches the CLT SDK that
        # Redis' tests/modules Makefile links against (Xcode's ld is older).
        sudo xcode-select -s /Library/Developer/CommandLineTools
        ld -v
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build
        pip install -r requirements.txt
    
    - name: Install auditwheel (Linux)
      if: runner.os == 'Linux'
      run: pip install auditwheel
    
    - name: Install delocate (macOS)
      if: runner.os == 'macOS'
      run: pip install delocate
    
    - name: Build package
      run: |
        python setup.py build
    
    - name: Build wheel
      run: |
        python setup.py bdist_wheel
    
    - name: Repair wheel with auditwheel (Linux)
      if: runner.os == 'Linux'
      run: |
        auditwheel repair dist/*.whl -w dist/
        rm dist/*-linux_*.whl  # Remove the original unrepaired wheel
    
    - name: Repair wheel with delocate (macOS)
      if: runner.os == 'macOS'
      run: |
        # delocate-wheel modifies wheels in place to bundle dependencies.
        # This is similar to auditwheel on Linux but for macOS.
        # Unlike auditwheel, we do not remove the original wheel here because delocate modifies the wheel in place,
        # so there is no unrepaired wheel to remove.
        delocate-wheel --require-archs arm64 -v dist/*.whl

    - name: Check macOS wheel architecture
      if: runner.os == 'macOS'
      run: |
        for wheel in dist/*.whl; do
          case "$wheel" in
            *x86_64*|*universal2*) echo "Wheel incorrectly advertises Intel support: $wheel" >&2; exit 1 ;;
            *macosx_*_arm64.whl) ;;
            *) echo "Unexpected macOS wheel tag: $wheel" >&2; exit 1 ;;
          esac
        done

    - name: Test repaired wheel
      working-directory: ${{ runner.temp }}
      run: |
        python -m venv wheel-test
        wheel-test/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
        cp "$GITHUB_WORKSPACE/verify_install.py" .
        wheel-test/bin/python verify_install.py
    
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
        path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.12'
    
    - name: Build sdist
      run: |
        python -m pip install --upgrade pip build
        python -m build --sdist
    
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: sdist
        path: dist/*.tar.gz

  test-sdist:
    name: Test source distribution on ${{ matrix.os }} Python ${{ matrix.python-version }}
    needs: build-sdist
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        python-version: ['3.12', '3.13', '3.14', '3.15']
      fail-fast: false

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Download source distribution
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: sdist
        path: ${{ runner.temp }}/source-dist/

    - name: Install build dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc make python3-dev

    - name: Install build dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gcc make libomp
        sudo xcode-select -s /Library/Developer/CommandLineTools

    - name: Install and test source distribution
      working-directory: ${{ runner.temp }}
      run: |
        python -m venv source-test
        source-test/bin/python -m pip install --no-cache-dir "$RUNNER_TEMP"/source-dist/*.tar.gz
        cp "$GITHUB_WORKSPACE/verify_install.py" .
        source-test/bin/python verify_install.py

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, test-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event.inputs.publish == 'true'
    permissions:
      id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
      contents: read
    
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: "*"
        path: dist
        merge-multiple: true
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      with:
        attestations: true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-packages
        path: dist/*
