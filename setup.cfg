[metadata]
author = FalkorDB
author_email = roi@falkordb.com
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Operating System :: MacOS :: MacOS X
    Operating System :: POSIX :: Linux
    Operating System :: POSIX
    Programming Language :: C
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: Implementation :: CPython
    Programming Language :: Python
    Topic :: Database
    Topic :: Software Development :: Libraries :: Python Modules
    Topic :: Software Development :: Libraries
description = FalkorDB embedded in a Python package
keywords = falkordb redis graph database cypher embedded python
license_expression = BSD-3-Clause AND (SSPL-1.0 OR AGPL-3.0-only) AND (LicenseRef-RSALv2 OR SSPL-1.0 OR AGPL-3.0-only) AND Apache-2.0 AND GPL-3.0-or-later WITH GCC-exception-3.1 AND Apache-2.0 WITH LLVM-exception AND (BSD-2-Clause OR CC0-1.0) AND MIT AND BSL-1.0
license_files =
    LICENSE.txt
    LICENSES/*
    NOTICE
long_description = file:README.md
long_description_content_type = text/markdown
name = falkordblite
project_urls =
    Homepage = https://www.falkordb.com/
    Documentation = https://docs.falkordb.com/
    Source = https://github.com/FalkorDB/falkordblite
url = https://github.com/FalkorDB/falkordblite

version = 0.11.0

[options]
install_requires=
    redis>=4.5
    falkordb[hiredis]>=1.8.0
    psutil
    setuptools>38.0
packages=
    redislite
python_requires = >=3.12.0

[screwdrivercd.version]
version_type = sdv4_SD_BUILD
